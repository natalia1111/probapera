<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Испытание Осьминога: Магия Знаний</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1a1a4a 0%, #0a0a2a 60%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- Шапка с осьминогом --- */
        header {
            width: 100%;
            padding: 20px 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0, 255, 255, 0.08), transparent);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
        }

        header img {
            width: 180px;
            height: auto;
            max-width: 60%;
            animation: float 3.5s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(0, 255, 255, 0.6));
        }

        @keyframes float {
            0%   { transform: translateY(0); }
            50%  { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        header h1 {
            margin: 10px 0 0;
            font-size: 1.6rem;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            text-align: center;
            letter-spacing: 1px;
        }

        /* --- Основная сцена --- */
        #main-scene {
            position: relative;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 30px 15px 60px;
        }

        #task-title {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 30px;
            color: #ccffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
            max-width: 90%;
            z-index: 20;
            line-height: 1.5;
        }

        #task-title strong {
            color: #00ffff;
        }

        /* --- Портал --- */
        .portal-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .portal-container {
            position: relative;
            width: 230px;
            height: 330px;
            border-radius: 50% / 20%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.85) 0%, rgba(0, 100, 255, 0.4) 40%, rgba(0, 0, 0, 0) 70%);
            box-shadow: 0 0 50px #00ffff, inset 0 0 50px #00ffff;
            animation: portalSpin 4s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s, opacity 0.5s;
        }

        .portal-ring {
            position: absolute;
            width: 110%;
            height: 110%;
            border: 4px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50% / 20%;
            animation: portalSpinReverse 6s linear infinite;
        }

        @keyframes portalSpin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes portalSpinReverse {
            0%   { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        /* --- Артефакты (Кнопки выбора) --- */
        .artifacts-container {
            display: flex;
            gap: 25px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
        }

        .artifact-btn {
            font-size: 2.8rem;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .artifact-btn span.label {
            font-size: 0.8rem;
            color: #aaeeff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .artifact-btn:hover {
            transform: scale(1.15);
            background: rgba(0, 255, 255, 0.25);
            box-shadow: 0 0 25px #00ffff;
        }

        /* --- Текст результата --- */
        #result-text {
            position: absolute;
            top: 30%;
            width: 100%;
            text-align: center;
            font-size: 2.2rem;
            color: #fff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-out;
            pointer-events: none;
            z-index: 30;
        }

        .show-result {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        /* --- Вспышка --- */
        .flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
        }

        .flash-active {
            animation: flashAnim 1s ease-out forwards;
        }

        @keyframes flashAnim {
            0%   { opacity: 0; }
            30%  { opacity: 1; }
            100% { opacity: 0; }
        }

        /* --- Сообщение об ошибке --- */
        #error-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff6666;
            font-size: 1.2rem;
            font-weight: bold;
            background: rgba(60, 0, 0, 0.7);
            padding: 12px 24px;
            border-radius: 10px;
            border: 1px solid #ff4444;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
            z-index: 40;
        }

        .show-error {
            opacity: 1 !important;
        }

        /* --- Адаптив --- */
        @media (max-width: 500px) {
            header img { width: 120px; }
            header h1 { font-size: 1.2rem; }
            #task-title { font-size: 1rem; }
            .artifact-btn { font-size: 2rem; padding: 8px 14px; }
            .portal-container { width: 180px; height: 260px; }
            #result-text { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- Шапка с осьминогом -->
    <header>
        <img src="octo.png" alt="Осьминог-Хранитель" id="octopus-img">
        <h1>Магия Знаний</h1>
    </header>

    <!-- Основная сцена -->
    <main id="main-scene">
        <div id="result-text">НОВЫЕ ЗНАНИЯ ПОЛУЧЕНЫ!</div>
        <div id="error-msg">Неверно! Попробуй другой артефакт.</div>

        <p id="task-title">
            Привет! Я — <strong>Осьминог-Хранитель</strong>.<br>
            Выбери артефакт, который символизирует <strong>науку и знания</strong>,
            чтобы пройти через портал!
        </p>

        <div class="portal-wrapper">
            <div class="portal-container" id="portal">
                <div class="portal-ring"></div>
            </div>
        </div>

        <div class="artifacts-container" id="artifacts">
            <button class="artifact-btn" data-id="globe" title="Глобус — география">
                🌍 <span class="label">Глобус</span>
            </button>
            <button class="artifact-btn" data-id="flask" title="Колба — наука">
                🧪 <span class="label">Колба</span>
            </button>
            <button class="artifact-btn" data-id="plant" title="Росток — природа">
                🌱 <span class="label">Росток</span>
            </button>
        </div>
    </main>

    <div class="flash-overlay" id="flash"></div>

    <script>
        const portal = document.getElementById('portal');
        const resultText = document.getElementById('result-text');
        const errorMsg = document.getElementById('error-msg');
        const flash = document.getElementById('flash');
        const taskTitle = document.getElementById('task-title');
        const artifactsContainer = document.getElementById('artifacts');

        // Если картинки octo.png нет — подставим эмодзи, чтобы не было "битой" иконки
        const octo = document.getElementById('octopus-img');
        octo.onerror = function () {
            this.style.display = 'none';
            const emoji = document.createElement('div');
            emoji.textContent = '🐙';
            emoji.style.fontSize = '100px';
            emoji.style.filter = 'drop-shadow(0 0 15px #00ffff)';
            this.parentNode.insertBefore(emoji, this);
        };

        const correctAnswer = 'flask'; // Правильный ответ — Колба

        artifactsContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.artifact-btn');
            if (!btn) return;

            const choice = btn.dataset.id;
            artifactsContainer.style.pointerEvents = 'none';

            // Получаем эмодзи (первый дочерний узел — текст с эмодзи)
            const emoji = btn.firstChild.textContent.trim();
            const rect = btn.getBoundingClientRect();

            // Создаём летящий клон
            const flyingEl = document.createElement('div');
            flyingEl.innerText = emoji;
            flyingEl.style.position = 'fixed';
            flyingEl.style.left = rect.left + 'px';
            flyingEl.style.top = rect.top + 'px';
            flyingEl.style.fontSize = '3rem';
            flyingEl.style.zIndex = '100';
            flyingEl.style.transition = 'all 1s ease-in-out';
            flyingEl.style.pointerEvents = 'none';
            document.body.appendChild(flyingEl);

            if (choice === correctAnswer) {
                // --- УСПЕХ ---
                taskTitle.style.opacity = '0';

                setTimeout(() => {
                    const portalRect = portal.getBoundingClientRect();
                    flyingEl.style.left = (portalRect.left + portalRect.width / 2 - 20) + 'px';
                    flyingEl.style.top  = (portalRect.top  + portalRect.height / 2 - 20) + 'px';
                    flyingEl.style.transform = 'scale(0.1) rotate(720deg)';
                    flyingEl.style.opacity = '0';
                }, 50);

                setTimeout(() => {
                    flyingEl.remove();
                    flash.classList.add('flash-active');
                    portal.style.transform = 'scale(1.5)';
                    portal.style.opacity = '0.5';

                    setTimeout(() => {
                        resultText.classList.add('show-result');
                        portal.style.display = 'none';
                        flash.classList.remove('flash-active');
                    }, 500);
                }, 1000);

            } else {
                // --- ОШИБКА ---
                setTimeout(() => {
                    flyingEl.style.transform = 'translateY(50px) scale(1.2)';
                    flyingEl.style.opacity = '0';
                }, 50);

                setTimeout(() => {
                    flyingEl.remove();
                    errorMsg.classList.add('show-error');

                    setTimeout(() => {
                        errorMsg.classList.remove('show-error');
                        artifactsContainer.style.pointerEvents = 'auto';
                    }, 2000);
                }, 1000);
            }
        });
    </script>
</body>
</html>
